<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growthway Poster</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Growthway Poster: brand palette, glass surfaces over a soft gradient (in the spirit of Buffer / Wealthsimple). */
  :root {
    --forest:#153C2A; --deep:#081F15; --sage:#D1E7AE; --cream:#F8F5EE; --rust:#C4632F;
    --ink:#0f241a; --muted:#5f6b63; --line:rgba(21,60,42,.10);
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.75);
    --shadow:0 1px 1px rgba(8,31,21,.04), 0 10px 30px -12px rgba(8,31,21,.18);
    --blur:saturate(170%) blur(22px);
    --r-lg:22px; --r-md:14px; --r-sm:10px;
    --side:232px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; background:#EEF0E8;
    background-image:
      radial-gradient(60vw 50vw at -10% -10%, rgba(209,231,174,.95), transparent 60%),
      radial-gradient(50vw 40vw at 110% 0%, rgba(21,60,42,.22), transparent 60%),
      radial-gradient(45vw 45vw at 90% 110%, rgba(196,99,47,.16), transparent 60%),
      radial-gradient(40vw 40vw at 0% 100%, rgba(209,231,174,.6), transparent 60%);
    background-attachment:fixed; }
  .glass { background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    border:1px solid var(--glass-edge); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8); }

  /* Top bar */
  header { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:rgba(248,245,238,.55); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; letter-spacing:-.01em; color:var(--forest); }
  .brand .mark { width:30px; height:30px; border-radius:9px; background:var(--forest); display:grid; place-items:center; color:var(--sage); font-weight:800; }
  header .sp { flex:1; }
  #acctf { width:auto; border-radius:999px; padding:7px 34px 7px 14px; font-weight:600; background-color:var(--glass-strong); }
  #signout { padding:7px 14px; }

  /* Navigation: sidebar on desktop, glass tab bar on phones */
  nav { position:fixed; z-index:25; display:flex; gap:4px; }
  nav button { display:flex; align-items:center; gap:10px; background:transparent; color:var(--muted); border:0; border-radius:12px; padding:10px 12px; font-weight:600; text-align:left; box-shadow:none; }
  nav button svg { width:20px; height:20px; flex:none; }
  nav button:hover { background:rgba(255,255,255,.55); color:var(--ink); }
  nav button.on { background:var(--forest); color:var(--cream); box-shadow:0 6px 16px -8px rgba(21,60,42,.8); }
  @media (min-width:900px) {
    nav { top:72px; left:16px; bottom:16px; width:var(--side); flex-direction:column; padding:12px; border-radius:var(--r-lg); }
    main { margin-left:calc(var(--side) + 32px) !important; }
  }
  @media (max-width:899px) {
    nav { left:10px; right:10px; bottom:max(10px, env(safe-area-inset-bottom)); justify-content:space-between; padding:6px; border-radius:22px; }
    nav button { flex:1; flex-direction:column; gap:2px; padding:7px 2px; font-size:10.5px; border-radius:16px; }
    main { padding-bottom:110px !important; }
  }

  main { max-width:1180px; padding:22px 20px 40px; margin:0 auto; }
  #banner { margin:12px 16px 0; border-radius:var(--r-md); }
  @media (min-width:900px) { #banner { margin-left:calc(var(--side) + 32px); } }

  /* Controls */
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:9px 16px; cursor:pointer; background:var(--forest); color:var(--cream);
    box-shadow:0 6px 16px -10px rgba(21,60,42,.9); transition:transform .12s ease, background .15s ease; }
  button:active { transform:scale(.97); }
  button.ghost { background:var(--glass-strong); color:var(--forest); border:1px solid var(--line); box-shadow:none; }
  button.ghost:hover { background:#fff; }
  button.rust { background:var(--rust); }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea, select { font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; background:rgba(255,255,255,.75); width:100%; outline:none; transition:border .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { border-color:rgba(21,60,42,.4); box-shadow:0 0 0 4px rgba(209,231,174,.6); }
  textarea { min-height:160px; resize:vertical; }
  a { color:var(--forest); }
  .mono { font-family:"JetBrains Mono", monospace; font-size:12px; letter-spacing:.04em; }

  /* Surfaces */
  .card { background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8); border-radius:var(--r-lg); padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700; background:var(--sage); color:var(--forest); white-space:nowrap; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.pending { background:#fdf1d8; color:#8a5a00; } .pill.failed { background:#fbe1d6; color:var(--rust); }
  .pill.approved { background:#e3f0d0; color:var(--forest); } .pill.publishing { background:#dfe9f5; color:#2b4f7a; }
  .pill.published { background:var(--forest); color:var(--sage); }
  .err { color:var(--rust); font-size:13px; white-space:pre-wrap; }
  .muted { color:var(--muted); font-size:13px; }
  h2 { font-size:16px; margin:18px 0 8px; letter-spacing:-.01em; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .scroll { overflow-x:auto; }
  #login, #noadmin { max-width:380px; margin:60px auto; }
  .tagx { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:12px; color:var(--muted); background:rgba(255,255,255,.5); }
  .bars { display:flex; align-items:flex-end; gap:3px; height:80px; } .bars i { display:block; flex:1; background:var(--sage); border-radius:3px 3px 0 0; } .bars i.top { background:var(--forest); }
  #toast { position:fixed; z-index:60; bottom:96px; left:50%; transform:translateX(-50%); background:rgba(8,31,21,.88); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:var(--cream); padding:10px 16px; border-radius:999px; display:none; font-weight:600; font-size:14px; box-shadow:var(--shadow); max-width:90vw; }

  /* Page header */
  .pagehead { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .pagehead h1 { margin:0; font-size:28px; letter-spacing:-.02em; font-weight:800; }
  .pagehead .sp { flex:1; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { padding:10px 14px; border-radius:var(--r-md); min-width:110px; }
  .stat b { display:block; font-size:22px; letter-spacing:-.02em; }
  .stat span { font-size:12px; color:var(--muted); font-weight:600; }
  .seg { display:inline-flex; gap:2px; padding:4px; border-radius:999px; margin-bottom:16px; max-width:100%; overflow-x:auto; scrollbar-width:none; }
  .seg::-webkit-scrollbar { display:none; }
  .seg button { white-space:nowrap; background:transparent; color:var(--muted); box-shadow:none; padding:7px 14px; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 2px 8px -2px rgba(8,31,21,.18); }

  /* Mini cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:14px; }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; } }
  .mini { position:relative; display:flex; flex-direction:column; text-align:left; padding:0; border-radius:18px; overflow:hidden; color:var(--ink);
    background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge);
    box-shadow:var(--shadow); cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; font-weight:400; }
  .mini:hover { transform:translateY(-3px); box-shadow:0 18px 40px -18px rgba(8,31,21,.35); }
  .mini .thumb { position:relative; aspect-ratio:4/5; background:var(--forest); overflow:hidden; }
  .mini .thumb img, .mini .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .mini .thumb .over { position:absolute; inset:auto 8px 8px 8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .mini .thumb .top { position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; gap:6px; }
  .chip { white-space:nowrap; display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
    background:rgba(255,255,255,.7); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); color:var(--ink); border:1px solid rgba(255,255,255,.6); }
  .chip.dark { background:rgba(8,31,21,.55); color:#fff; border-color:rgba(255,255,255,.15); }
  .mini .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; }
  .mini .t { font-weight:700; font-size:14px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mini .m { font-size:12px; color:var(--muted); }
  .empty { padding:40px 20px; text-align:center; }
  .mini .pill, .mini .chip { font-size:11px; padding:2px 8px; }
  html, body { overflow-x:hidden; }
  @media (max-width:520px) {
    header { padding:10px 12px; gap:8px; }
    .brand span:last-child { display:none; }
    #acctf { flex:1; min-width:0; max-width:200px; font-size:13px; }
    #signout { padding:7px 12px; font-size:13px; }
    main { padding:16px 12px 40px; }
    .pagehead h1 { font-size:24px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat { min-width:0; padding:8px 10px; } .stat b { font-size:19px; } .stat span { font-size:11px; }
    .mini .body { padding:8px 10px 10px; } .mini .t { font-size:13px; }
  }

  /* Detail sheet */
  .sheet { position:fixed; inset:0; z-index:50; display:flex; justify-content:flex-end; }
  .sheet[hidden] { display:none; }
  .sheet .scrim { position:absolute; inset:0; background:rgba(8,31,21,.28); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:fade .2s ease; }
  .sheet .panel { position:relative; width:min(560px, 100%); height:100%; overflow:auto; padding:20px 20px 40px; border-radius:var(--r-lg) 0 0 var(--r-lg);
    background:rgba(250,249,244,.86); -webkit-backdrop-filter:saturate(170%) blur(30px); backdrop-filter:saturate(170%) blur(30px);
    border-left:1px solid var(--glass-edge); box-shadow:-20px 0 60px -20px rgba(8,31,21,.35); animation:slidein .25s cubic-bezier(.2,.8,.2,1); }
  .sheet .close { position:sticky; top:0; float:right; z-index:2; width:36px; height:36px; padding:0; border-radius:50%; background:rgba(255,255,255,.85); color:var(--ink); border:1px solid var(--line); box-shadow:none; font-size:18px; line-height:1; }
  .sheet .post { display:block; }
  .sheet .post video, .sheet .post .strip { width:100%; max-width:300px; margin:0 auto 14px; display:block; }
  .sheet .post video { aspect-ratio:9/16; border-radius:16px; background:#000; }
  .strip { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; } .strip img { width:240px; border-radius:12px; flex:none; scroll-snap-align:start; }
  .sheet .strip { max-width:100% !important; }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin:14px 0; }
  .kv div { padding:10px 12px; border-radius:var(--r-md); background:rgba(255,255,255,.7); border:1px solid var(--line); }
  .kv b { display:block; font-size:20px; letter-spacing:-.02em; } .kv span { font-size:12px; color:var(--muted); font-weight:600; }
  @media (max-width:640px) {
    .sheet { align-items:flex-end; }
    .sheet .panel { height:92vh; border-radius:24px 24px 0 0; border-left:0; border-top:1px solid var(--glass-edge); animation:slideup .28s cubic-bezier(.2,.8,.2,1); }
  }
  .sheet .actions { position:sticky; bottom:-40px; margin:16px -20px -40px; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(250,249,244,.9); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:1px solid var(--line); }
  @keyframes fade { from { opacity:0; } }
  @keyframes slidein { from { transform:translateX(40px); opacity:0; } }
  @keyframes slideup { from { transform:translateY(60px); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">g</span><span>Growthway Poster</span></div>
  <span class="sp"></span>
  <select id="acctf" hidden aria-label="Show posts for"></select>
  <button id="signout" class="ghost" hidden>Sign out</button>
</header>
<nav id="nav" class="glass" hidden>
  <button data-tab="queue" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Queue</span></button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/></svg><span>Posted</span></button>
  <button data-tab="comments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg><span>Comments</span></button>
  <button data-tab="research"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Research</span></button>
  <button data-tab="inspo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Inspiration</span></button>
  <button data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Accounts</span></button>
</nav>

<div id="banner" hidden style="background:rgba(251,225,214,.85);color:#8a3a12;padding:12px 16px;font-weight:600;border:1px solid rgba(196,99,47,.25)"></div>
<main>
  <section id="login" class="card" hidden>
    <h2 style="margin-top:0">Sign in</h2>
    <p class="muted">Only accounts on the admin list can see the queue.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <div style="height:8px"></div>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row"><button id="signin">Sign in</button><button id="signup" class="ghost">Create login</button></div>
    <p id="loginmsg" class="muted"></p>
  </section>

  <section id="noadmin" class="card" hidden>
    <h2 style="margin-top:0">Signed in, waiting for access</h2>
    <p class="muted">Your login works, but it isn't on the admin list yet. Tell Claude you've signed up and it will add you.</p>
  </section>

  <section id="queue" hidden></section>
  <section id="history" hidden></section>
  <section id="comments" hidden></section>
  <section id="research" hidden></section>
  <section id="inspo" hidden></section>
  <section id="accounts" hidden></section>
</main>
<div id="toast"></div>
<div id="sheet" class="sheet" hidden><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true"><button class="close" data-close aria-label="Close">×</button><div id="sheet-body"></div></div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const URL_ = "https://gacwxtcdzmxfvxqrrveb.supabase.co";
const KEY = "sb_publishable_11ISE9lw3_UgP0yADxCDKQ_HtkufjkA"; // publishable key: safe in the browser, data is protected by row-level security
const PUBLIC = `${URL_}/storage/v1/object/public/reels/`;
const sb = createClient(URL_, KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const POST_COLS = "id,account_id,title,caption,video_path,cover_path,source,status,scheduled_for,approved_at,ig_media_id,permalink,published_at,error,attempts,created_at,location_id,trial,kind,media,format,hook,variant_group,variant";
let locations = [];
const TRIAL = { "": "Regular reel (followers + non-followers)", MANUAL: "Trial reel: non-followers first, I graduate it in the app", SS_PERFORMANCE: "Trial reel: non-followers first, auto-graduate if it performs" };
let accounts = [];
const SHARED = (() => { const q = new URLSearchParams(location.search); const t = [q.get("add"), q.get("url"), q.get("text")].filter(Boolean).join(" "); return (t.match(/https?:\/\/\S*instagram\.com\S*/) ?? [""])[0]; })();
let tab = SHARED ? "inspo" : "queue";
// Account filter (top right): "" = all accounts. Remembered on this device.
let filt = ""; try { filt = localStorage.getItem("acctf") ?? ""; } catch {}
const scope = (q) => (filt ? q.eq("account_id", filt) : q);

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }
function fmt(ts) { return ts ? new Date(ts).toLocaleString("en-CA", { dateStyle: "medium", timeStyle: "short" }) : ""; }
function localInput(d) { const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function defaultSlot() { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(11, 30, 0, 0); return d; }
const acct = (id) => accounts.find((a) => a.id === id) ?? {};
function openSheet(html) { $("#sheet-body").innerHTML = html; $("#sheet").hidden = false; document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").hidden = true; $("#sheet-body").innerHTML = ""; document.body.style.overflow = ""; }
for (const x of document.querySelectorAll("#sheet [data-close]")) x.onclick = closeSheet;
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
const shortTime = (ts) => ts ? new Date(ts).toLocaleString("en-CA", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const nfmt = (n) => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const thumbOf = (p) => p.kind === "carousel" ? (p.media?.[0] ? PUBLIC + p.media[0] : "") : (p.cover_path ? PUBLIC + p.cover_path : "");

async function callFn(name, body = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${URL_}/functions/v1/${name}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: KEY }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error ?? r.statusText);
  return j;
}

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show("login"); return; }
  $("#signout").hidden = false;
  const { data: isAdmin } = await sb.rpc("is_admin");
  if (!isAdmin) { show("noadmin"); return; }
  $("#nav").hidden = false;
  const { data } = await sb.from("ig_accounts").select("id,handle,label,token_secret,api_host,ig_user_id,active,last_error,default_location_id,default_trial,best_hours,data_access_expires").order("label");
  accounts = data ?? [];
  if (filt && !accounts.some((a) => a.id === filt)) filt = "";
  const f = $("#acctf"); f.hidden = accounts.length < 2;
  f.innerHTML = `<option value="">All accounts</option>` + accounts.map((a) => `<option value="${a.id}" ${a.id === filt ? "selected" : ""}>@${esc(a.handle)}</option>`).join("");
  f.onchange = () => { filt = f.value; try { localStorage.setItem("acctf", filt); } catch {} render(); };
  locations = (await sb.from("locations").select("id,name,city,state,country").order("name")).data ?? [];
  banner();
  for (const x of document.querySelectorAll("#nav button")) x.classList.toggle("on", x.dataset.tab === tab);
  render();
}
// Token trouble or Meta's 90-day re-approval coming up: say so at the top of every tab.
function banner() {
  const msgs = [];
  for (const a of accounts) {

  }
  const b = $("#banner"); b.hidden = !msgs.length; b.innerHTML = msgs.map(esc).join("<br>");
}

  el.innerHTML = `<div class="pagehead"><div><h1>Queue</h1><div class="muted">Nothing posts until you approve it. Scheduled posts go out within 15 minutes of their time.</div></div><span class="sp"></span><button class="ghost" id="runpub">Run posting check</button></div>
    <div class="stats">${[["pending", "Needs review"], ["approved", "Scheduled"], ["failed", "Failed"]].map(([k, t]) => `<div class="stat glass"><b>${n(k)}</b><span>${t}</span></div>`).join("")}</div>
    <div class="seg glass">${[["all", `All ${posts.length}`], ["pending", "Needs review"], ["approved", "Scheduled"], ["failed", "Failed"]].map(([k, t]) => `<button data-qf="${k}" class="${queueFilter === k ? "on" : ""}">${t}</button>`).join("")}</div>
    ${shown.length ? `<div class="grid">${shown.map(miniPost).join("")}</div>` : `<div class="card empty muted">${filt ? `Nothing here for @${esc(acct(filt).handle)}.` : "Nothing here."} New posts land in the queue as they're made.</div>`}`;
  $("#runpub").onclick = async (e) => { e.target.disabled = true; try { const r = await callFn("publisher"); toast(r.log.length ? r.log.join(" · ") : "Nothing due right now"); } catch (err) { toast(err.message); } e.target.disabled = false; renderQueue(); };
  for (const b of el.querySelectorAll("[data-qf]")) b.onclick = () => { queueFilter = b.dataset.qf; renderQueue(); };

        ${p.status === "approved" ? `<span class="muted">Scheduled for ${fmt(p.scheduled_for)}${p.trial && p.kind !== "carousel" ? " · trial reel" : ""}</span><button class="ghost" data-a="reschedule">Save changes</button><button class="ghost" data-a="unapprove">Unschedule</button>` : ""}
        ${p.status === "publishing" ? `<span class="muted">Instagram is processing the video…${p.trial ? " (trial reel)" : ""}</span>` : ""}
        ${p.status === "failed" ? `<button data-a="retry">Retry</button><button class="ghost" data-a="save">Save caption</button><button class="ghost" data-a="reject">Reject</button>` : ""}

function wirePost(p) {
  const root = $(`#p-${p.id}`); if (!root) return;
  const cap = root.querySelector('[data-f="caption"]'), when = root.querySelector('[data-f="when"]');
  const loc = root.querySelector('[data-f="loc"]'), trial = root.querySelector('[data-f="trial"]');
  const extra = () => ({ location_id: loc.value || null, trial: trial.value || null });
  cap.oninput = () => root.querySelector("[data-count]").textContent = cap.value.length;
  const upd = async (patch, msg) => {
    const { error } = await sb.from("posts").update(patch).eq("id", p.id);
    if (error) toast(error.message); else { toast(msg); closeSheet(); renderQueue(); }
  };
  const check = () => {
    if (cap.value.length > 2200) { toast("Caption is over Instagram's 2,200 characters"); return false; }
    if ((cap.value.match(/#\w+/g) ?? []).length > 30) { toast("Instagram allows 30 hashtags at most"); return false; }
    return true;
  };
  for (const b of root.querySelectorAll("[data-a]")) b.onclick = async () => {
    const a = b.dataset.a;
    if (a === "approve" && check()) {
      const t = new Date(when.value);
      if (!(t > new Date())) { toast("Pick a time in the future, or use 'post now'"); return; }
      upd({ caption: cap.value, ...extra(), status: "approved", scheduled_for: t.toISOString(), approved_at: new Date().toISOString(), error: null }, `Scheduled for ${fmt(t)}`);
    }
    if (a === "now" && check() && confirm(`Post this ${p.kind === "carousel" ? "carousel" : "reel"} to @${acct(p.account_id).handle} now?`)) {
      await sb.from("posts").update({ caption: cap.value, ...extra(), status: "approved", scheduled_for: new Date().toISOString(), approved_at: new Date().toISOString(), error: null }).eq("id", p.id);
      try { const r = await callFn("publisher"); toast(r.log.join(" · ") || "Sent"); } catch (e) { toast(e.message); }
      closeSheet(); renderQueue();
    }
    if (a === "save" && check()) upd({ caption: cap.value, ...extra() }, "Saved");
    if (a === "reject" && confirm("Reject this reel? It won't post.")) upd({ status: "rejected" }, "Rejected");
    if (a === "unapprove") upd({ status: "pending", scheduled_for: null, approved_at: null }, "Back in the queue, not scheduled");
    if (a === "reschedule") { const t = new Date(when.value); if (t > new Date()) upd({ scheduled_for: t.toISOString(), ...extra() }, `Moved to ${fmt(t)}`); else toast("Pick a time in the future"); }
    if (a === "retry" && check()) upd({ caption: cap.value, ...extra(), status: "approved", scheduled_for: new Date().toISOString(), attempts: 0, error: null }, "Will retry at the next check");
  };
}

  const avg = (xs) => xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : null;

      <p class="muted">Views are Instagram's count, refreshed daily for 30 days after posting.</p></div>
    <div class="pagehead" style="margin-top:8px"><h1 style="font-size:22px">Posts</h1></div>

        <div class="thumb">${media.get(p.id) ? `<img src="${esc(media.get(p.id))}" loading="lazy" alt="">` : ""}
          <div class="top"><span class="pill published">${p.trial ? "Trial" : "Posted"}</span>${p.variant ? `<span class="chip dark">A/B · ${esc(p.variant)}</span>` : ""}</div>
          <div class="over"><span class="chip">▶ ${nfmt(p.views)}</span>${p.likes != null ? `<span class="chip">♥ ${nfmt(p.likes)}</span>` : ""}</div></div>
        <div class="body"><div class="t">${esc(p.title ?? "Post")}</div><div class="m">${esc(p.format ?? (p.kind ?? ""))} · ${shortTime(p.published_at)}</div></div></button>`).join("")}</div>`
      : `<div class="card empty muted">Nothing posted yet.</div>`}`;
  for (const p of rows) $(`#h-${p.id}`).onclick = () => openSheet(`

// ---------- inspiration ----------
// Reels and posts you save from your personal feeds: paste the link (Share → Copy link), tag it, add a note.
// The "inspire" function fills in the author's followers and the post's views when the author is a public
// business or creator account (it recognises Research-list accounts on its own; otherwise type the @author).
const CATS = ["Hook", "Format", "Topic", "Editing / visuals", "Audio / trend", "Caption", "Other"];
let inspoView = { cat: "", status: "new", q: "" };
const igLink = (s) => (String(s).match(/https?:\/\/(?:www\.)?instagram\.com\/[^\s?#]+/) ?? [""])[0];
const num = (n) => n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
async function renderInspo() {
  const el = $("#inspo");
  let q = scope(sb.from("inspirations").select("*")).order("created_at", { ascending: false }).limit(300);
  const { data, error } = await q;
  if (error) { el.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  const all = data ?? [];
  const cats = [...new Set([...CATS, ...all.map((r) => r.category).filter(Boolean)])];
  const rows = all.filter((r) => (!inspoView.cat || r.category === inspoView.cat) && (inspoView.status === "all" || r.status === inspoView.status)
    && (!inspoView.q || [r.author, r.notes, r.caption, r.category].join(" ").toLowerCase().includes(inspoView.q.toLowerCase())));
  const count = (c) => all.filter((r) => r.category === c && r.status !== "archived").length;
  el.innerHTML = `<div class="card"><h2 style="margin-top:0">Save a reel</h2>
      <p class="muted">On Instagram, tap Share → Copy link, then paste it here. Add the @author if you know it: that's how we get views and followers (accounts on the Research list are recognised automatically).</p>
      <div class="row"><input id="iurl" placeholder="https://www.instagram.com/reel/…" value="${esc(SHARED)}" style="flex:2;min-width:220px"><button class="ghost" id="ipaste">Paste</button></div>
      <div class="row"><input id="iauthor" placeholder="@author (optional)" style="max-width:200px">
        <select id="icat" style="max-width:200px"><option value="">Category…</option>${cats.map((c) => `<option>${esc(c)}</option>`).join("")}<option value="+">+ New category</option></select>
        ${accounts.length > 1 ? `<select id="iacct" style="max-width:200px">${accounts.map((a) => `<option value="${a.id}" ${a.id === filt ? "selected" : ""}>for @${esc(a.handle)}</option>`).join("")}</select>` : ""}</div>
      <textarea id="inote" placeholder="What's worth borrowing? (the hook, the structure, the edit…)" style="min-height:60px;margin-top:8px"></textarea>
      <div class="row"><button id="isave">Save</button><span id="imsg" class="muted"></span></div></div>
    <div class="card"><div class="row" style="margin-top:0">
      <button class="${inspoView.cat ? "ghost" : ""}" data-icat="">All</button>
      ${cats.filter(count).map((c) => `<button class="${inspoView.cat === c ? "" : "ghost"}" data-icat="${esc(c)}">${esc(c)} (${count(c)})</button>`).join("")}</div>
      <div class="row"><select id="istatus" style="max-width:160px">${[["new", "To use"], ["used", "Used"], ["archived", "Archived"], ["all", "All"]].map(([v, t]) => `<option value="${v}" ${inspoView.status === v ? "selected" : ""}>${t}</option>`).join("")}</select>
        <input id="isearch" placeholder="Search notes, captions, authors" value="${esc(inspoView.q)}" style="max-width:280px"><span class="muted">${rows.length} saved</span></div></div>`
    + (rows.length ? rows.map((r) => `<div class="card" id="i-${r.id}">
        <div class="row" style="margin-top:0"><a href="${esc(r.url)}" target="_blank" rel="noopener"><strong>${r.author ? "@" + esc(r.author) : "Open on Instagram"}</strong></a>
          ${r.media_type ? `<span class="tagx">${esc(r.media_type)}</span>` : ""}
          ${r.author_followers != null ? `<span class="muted">${num(r.author_followers)} followers</span>` : ""}
          ${r.view_count != null ? `<span><strong>${num(r.view_count)}</strong> views</span>` : ""}
          ${r.view_count != null && r.author_followers ? `<span class="tagx" title="views ÷ followers">${(r.view_count / r.author_followers).toFixed(1)}× reach</span>` : ""}
          ${r.like_count != null ? `<span class="muted">${num(r.like_count)} likes · ${num(r.comments_count)} comments</span>` : ""}
          <span class="muted">saved ${fmt(r.created_at)}</span></div>
        ${r.caption ? `<p class="muted" style="margin:6px 0">${esc(r.caption.slice(0, 220))}${r.caption.length > 220 ? "…" : ""}</p>` : ""}
        ${r.fetch_error ? `<p class="muted" style="margin:6px 0">ⓘ ${esc(r.fetch_error)}</p>` : ""}
        <div class="row"><select data-f="category" style="max-width:200px"><option value="">No category</option>${cats.map((c) => `<option ${r.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
          ${r.author ? "" : `<input data-f="author" placeholder="@author" style="max-width:160px">`}</div>
        <textarea data-f="notes" placeholder="Notes" style="min-height:50px;margin-top:8px">${esc(r.notes ?? "")}</textarea>
        <div class="row">${r.status !== "used" ? `<button class="ghost" data-st="used">Mark used</button>` : `<button class="ghost" data-st="new">Back to “to use”</button>`}
          ${r.status !== "archived" ? `<button class="ghost" data-st="archived">Archive</button>` : ""}
          <button class="ghost" data-look>Look up again</button><button class="ghost" data-del>Delete</button></div></div>`).join("")
      : `<div class="card muted">Nothing here yet. Save a reel above.</div>`);

  const catSel = $("#icat");
  catSel.onchange = () => { if (catSel.value === "+") { const n = prompt("New category name"); if (n?.trim()) { catSel.add(new Option(n.trim(), n.trim(), true, true)); } else catSel.value = ""; } };
  $("#ipaste").onclick = async () => { try { $("#iurl").value = await navigator.clipboard.readText(); } catch { toast("Long-press the box and choose Paste"); } };
  $("#isave").onclick = async () => {
    const url = igLink($("#iurl").value);
    if (!url) { toast("That doesn't look like an Instagram link"); return; }
    $("#imsg").textContent = "Saving…";
    const row = { url, author: $("#iauthor").value.replace(/^@/, "").trim() || null, category: catSel.value && catSel.value !== "+" ? catSel.value : null,
      notes: $("#inote").value.trim() || null, account_id: $("#iacct")?.value || filt || accounts[0]?.id || null };
    const { data: ins, error } = await sb.from("inspirations").insert(row).select("id").single();
    if (error) { $("#imsg").textContent = /duplicate/.test(error.message) ? "Already saved." : error.message; return; }
    if (SHARED) history.replaceState(null, "", location.pathname);
    $("#imsg").textContent = "Saved. Looking it up…";
    try { await callFn("inspire", { id: ins.id }); } catch {}
    inspoView.status = "new"; renderInspo();
  };
  for (const b of el.querySelectorAll("[data-icat]")) b.onclick = () => { inspoView.cat = b.dataset.icat; renderInspo(); };
  $("#istatus").onchange = (e) => { inspoView.status = e.target.value; renderInspo(); };
  $("#isearch").onchange = (e) => { inspoView.q = e.target.value.trim(); renderInspo(); };
  for (const r of rows) {
    const root = document.getElementById(`i-${r.id}`);
    const save = async (patch, msg) => { const { error } = await sb.from("inspirations").update(patch).eq("id", r.id); toast(error ? error.message : msg); };
    root.querySelector('[data-f="category"]').onchange = (e) => save({ category: e.target.value || null }, "Category saved");
    root.querySelector('[data-f="notes"]').onchange = (e) => save({ notes: e.target.value.trim() || null }, "Note saved");
    const au = root.querySelector('[data-f="author"]');
    if (au) au.onchange = async (e) => { await save({ author: e.target.value.replace(/^@/, "").trim() || null }, "Looking it up…"); try { await callFn("inspire", { id: r.id }); } catch {} renderInspo(); };
    for (const b of root.querySelectorAll("[data-st]")) b.onclick = async () => { await save({ status: b.dataset.st }, "Updated"); renderInspo(); };
    root.querySelector("[data-look]").onclick = async (e) => { e.target.disabled = true; try { await callFn("inspire", { id: r.id }); } catch (err) { toast(err.message); } renderInspo(); };
    root.querySelector("[data-del]").onclick = async () => { if (!confirm("Delete this saved reel?")) return; await sb.from("inspirations").delete().eq("id", r.id); renderInspo(); };
  }
}

// ---------- accounts ----------
async function renderAccounts() {
  const el = $("#accounts");
  const locOpts = (sel) => `<option value="">No location</option>${locations.map((l) => `<option value="${l.id}" ${l.id === sel ? "selected" : ""}>${esc(l.name)}${l.city ? ` · ${esc(l.city)}` : ""}</option>`).join("")}`;
  el.innerHTML = `<div class="card"><h2 style="margin-top:0">Reconnect Instagram</h2>
      <p class="muted">In Meta's <a href="https://developers.facebook.com/tools/explorer/" target="_blank" rel="noopener">Graph API Explorer</a>, pick your app, press <b>Generate Access Token</b>, tap the copy icon, and paste it here. Any token works: this turns it into one that never expires, checks it, and connects every account whose Facebook Page it can see.</p>
      <div class="row"><input id="tok" type="password" placeholder="Paste the token" autocomplete="off" style="max-width:420px"><button id="tokgo">Connect</button></div>
      <div id="tokout" class="muted" style="margin-top:8px"></div></div>
    <div class="card scroll"><h2 style="margin-top:0">Instagram accounts</h2>
    <table><tr><th>Account</th><th>Connected</th><th>Default location</th><th>Default audience</th><th>Status</th></tr>
    ${accounts.map((a) => `<tr><td>@${esc(a.handle)}<div class="mono muted">${esc(a.token_secret)}</div></td><td>${a.ig_user_id ? `<span class="pill published">yes</span>` : `<span class="pill pending">not yet</span>`}</td>
      <td><select data-acc-loc="${a.id}">${locOpts(a.default_location_id)}</select></td>
      <td><select data-acc-trial="${a.id}">${Object.entries(TRIAL).map(([v, t]) => `<option value="${v}" ${(a.default_trial ?? "") === v ? "selected" : ""}>${t}</option>`).join("")}</select></td>
      <td>${a.last_error ? `<span class="err">${esc(a.last_error)}</span>` : (a.ig_user_id ? "OK" : "Waiting for the token")}</td></tr>`).join("")}
    </table>
    ${accounts.filter((a) => a.best_hours).map((a) => { const h = a.best_hours; const max = Math.max(...Object.values(h)); const top = Object.entries(h).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([k]) => +k);
      return `<h2>When @${esc(a.handle)}'s followers are online</h2><div class="bars">${Array.from({ length: 24 }, (_, k) => `<i class="${top.includes(k) ? "top" : ""}" title="${k}:00" style="height:${Math.max(4, ((h[k] ?? 0) / max) * 100)}%"></i>`).join("")}</div><p class="muted">Hours 0–23 as Instagram reports them (Instagram's own time zone, not necessarily Toronto). Busiest: ${top.map((k) => k + ":00").join(", ")}.</p>`; }).join("")}
    <p class="muted">Defaults apply to new reels as they arrive in the queue; you can still change them per reel. Tokens are stored encrypted in Supabase Vault; this page never shows them.</p></div>
    <div class="card"><h2 style="margin-top:0">Locations</h2>
      <p class="muted">A location tag has to be a Facebook Page with an address. Your own Pages work; searching other places needs Meta's "Page Public Metadata Access" approval.</p>
      <div class="row"><button class="ghost" id="locown">Add my Pages' locations</button><input id="locid" placeholder="Facebook Page ID or link" style="max-width:300px"><button id="locadd">Add</button></div>
      <table style="margin-top:10px"><tr><th>Name</th><th>Place</th><th>Page ID</th><th></th></tr>
      ${locations.map((l) => `<tr><td>${esc(l.name)}</td><td>${esc([l.city, l.state, l.country].filter(Boolean).join(", "))}</td><td class="mono">${esc(l.id)}</td><td><button class="ghost" data-locdel="${l.id}">Remove</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">No locations yet.</td></tr>`}
      </table></div>`;
  $("#tokgo").onclick = async () => {
    const v = $("#tok").value.trim(); if (!v) return;
    const out = $("#tokout"); out.textContent = "Checking with Meta…"; $("#tokgo").disabled = true;
    try {
      const r = await callFn("connect", { token: v });
      $("#tok").value = "";
      const html = (r.results.length ? r.results.map((x) => `<div class="${x.ok ? "" : "err"}">@${esc(x.handle)}: ${esc(x.message)}</div>`).join("")
        : `<div class="err">None of your accounts matched.</div>`)
        + `<div class="muted" style="margin-top:6px">Facebook Pages this token can see: ${esc(r.pages.join(", ") || "none")}. An account connects when its Page is listed here with that Instagram handle.</div>`;
      if (r.results.some((x) => x.ok)) await boot();
      $("#tokout").innerHTML = html;
    } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    finally { const b = $("#tokgo"); if (b) b.disabled = false; }
  };
  for (const s of el.querySelectorAll("[data-acc-loc]")) s.onchange = async () => { const { error } = await sb.from("ig_accounts").update({ default_location_id: s.value || null }).eq("id", s.dataset.accLoc); toast(error ? error.message : "Default location saved"); boot(); };
  for (const s of el.querySelectorAll("[data-acc-trial]")) s.onchange = async () => { const { error } = await sb.from("ig_accounts").update({ default_trial: s.value || null }).eq("id", s.dataset.accTrial); toast(error ? error.message : "Default audience saved"); boot(); };
  const save = async (results) => {
    const ok = (results ?? []).filter((r) => r.hasLocation);
    if (!ok.length) { toast(results?.[0]?.error ?? "That Page has no address on Facebook, so it can't be a location tag"); return; }
    const { error } = await sb.from("locations").upsert(ok.map((r) => ({ id: r.id, name: r.name, city: r.city, state: r.state, country: r.country })));
    toast(error ? error.message : `Added ${ok.map((r) => r.name).join(", ")}`); boot();
  };
  $("#locown").onclick = async () => { try { save((await callFn("locations", { own: true })).results); } catch (e) { toast(e.message); } };
  $("#locadd").onclick = async () => { const v = $("#locid").value.trim(); if (!v) return; try { save((await callFn("locations", { id: v })).results); } catch (e) { toast(e.message); } };
  for (const b of el.querySelectorAll("[data-locdel]")) b.onclick = async () => { if (!confirm("Remove this location?")) return; await sb.from("locations").delete().eq("id", b.dataset.locdel); boot(); };
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") location.reload(); });
boot();
</script>
</body>
</html>
